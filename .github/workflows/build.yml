name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read package version
        id: pkgver
        shell: pwsh
        run: |
          $v = (dotnet msbuild VideoEditorCS.csproj -getProperty:Version -nologo).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore VideoEditorCS.sln

      - name: Build
        run: dotnet build VideoEditorCS.sln --configuration Release --no-restore

      - name: Publish Windows x64 (self-contained)
        run: dotnet publish VideoEditorCS.csproj --configuration Release -r win-x64 --self-contained true -o publish/win-x64 --no-restore

      - name: Publish Windows ARM64 (self-contained)
        run: dotnet publish VideoEditorCS.csproj --configuration Release -r win-arm64 --self-contained true -o publish/win-arm64 --no-restore

      - name: Zip portable packages
        shell: pwsh
        env:
          PKG_VERSION: ${{ steps.pkgver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "dist/VideoEditor-$env:PKG_VERSION-win-x64.zip" -Force
          Compress-Archive -Path "publish/win-arm64/*" -DestinationPath "dist/VideoEditor-$env:PKG_VERSION-win-arm64.zip" -Force

      - name: Upload portable Windows x64 (.zip)
        id: artifact-x64
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-${{ steps.pkgver.outputs.version }}-win-x64-zip
          path: dist/VideoEditor-${{ steps.pkgver.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 3

      - name: Upload portable Windows ARM64 (.zip)
        id: artifact-arm64
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-${{ steps.pkgver.outputs.version }}-win-arm64-zip
          path: dist/VideoEditor-${{ steps.pkgver.outputs.version }}-win-arm64.zip
          if-no-files-found: error
          retention-days: 3

      - name: Upload framework-dependent folder (requires .NET 8 Desktop Runtime)
        id: artifact-framework
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-framework-dependent-net8.0-windows
          path: bin/Release/net8.0-windows/
          if-no-files-found: error
          retention-days: 3

      - name: Summary
        if: success()
        shell: bash
        env:
          PKG_VERSION: ${{ steps.pkgver.outputs.version }}
          ARTIFACT_X64: ${{ steps.artifact-x64.outcome }}
          ARTIFACT_ARM64: ${{ steps.artifact-arm64.outcome }}
          ARTIFACT_FRAMEWORK: ${{ steps.artifact-framework.outcome }}
        run: |
          {
            echo "## Build and packages"
            echo ""
            echo "This app is **WPF (.NET)** and runs on **Windows only**. There is no macOS or Linux build of this UI (a different UI stack such as Avalonia or MAUI would be required)."
            echo ""
            echo "### Artifacts (this run)"
            echo ""
            echo "| Platform | Artifact |"
            echo "|----------|----------|"
            if [ "$ARTIFACT_X64" = "success" ]; then
              echo "| Windows x64 (portable, self-contained) | \`VideoEditor-${PKG_VERSION}-win-x64-zip\` |"
            fi
            if [ "$ARTIFACT_ARM64" = "success" ]; then
              echo "| Windows ARM64 (portable, self-contained) | \`VideoEditor-${PKG_VERSION}-win-arm64-zip\` |"
            fi
            if [ "$ARTIFACT_FRAMEWORK" = "success" ]; then
              echo "| Windows (smaller; needs [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)) | \`VideoEditor-framework-dependent-net8.0-windows\` |"
            fi
            echo ""
            echo "[View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
